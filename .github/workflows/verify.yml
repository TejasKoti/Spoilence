name: Verify Spoilence browser extensions
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
defaults:
  run:
    working-directory: backend
jobs:
  browser-product:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24.21.0"
      - run: npm install --global pnpm@12.21.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm package
      - run: pnpm exec playwright install chromium firefox webkit
      - run: pnpm test:e2e
      - run: pnpm test:installed
      - run: pnpm test:product
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: Spoilence-browser-downloads
          path: product/
  website:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24.21.0"
      - run: npm install --global pnpm@12.21.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm package
      - run: npm ci
        working-directory: website
      - run: npm run sync:product
        working-directory: website
      - run: npm run build
        working-directory: website
      - run: npm run check:deploy
        working-directory: website
      - run: pnpm exec playwright install chromium firefox webkit
      - run: pnpm test:website
